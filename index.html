<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stockr — Stock Analyst</title>
<meta name="description" content="AI-powered stock analyst with real-time prices and portfolio tracking">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stockr">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2311998E'/%3E%3Cstop offset='1' stop-color='%2338EF7D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='14' fill='%236366f1'/%3E%3Crect x='10' y='55' width='18' height='30' rx='4' fill='white' opacity='.9'/%3E%3Crect x='37' y='38' width='18' height='47' rx='4' fill='white' opacity='.9'/%3E%3Cpath d='M62 92 L80 92 L80 34 L96 34 L72 6 L48 34 L62 34Z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW:',e));
  });
}
</script>
<style>
:root{--p:#6366f1;--pd:#4f46e5;--pl:#eef2ff;--g:#10b981;--r:#ef4444;--a:#f59e0b;--t:#0f172a;--t2:#334155;--t3:#64748b;--t4:#94a3b8;--b:#e2e8f0;--bg:#f8fafc;--w:#fff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--t);height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
input,button,select{font-family:'Montserrat',sans-serif;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

/* SETUP */
#auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#f0f4ff,#e8f4ff);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;overflow-y:auto;}
#setup.hide{display:none;}
.sc{background:#fff;border-radius:22px;box-shadow:0 8px 40px rgba(99,102,241,0.13);padding:28px 24px;max-width:440px;width:100%;}
.logo{width:60px;height:60px;background:linear-gradient(135deg,var(--p),var(--pd));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;font-weight:800;color:#fff;letter-spacing:2px;box-shadow:0 4px 18px rgba(99,102,241,0.35);}
.sc h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:5px;}
.sc .sub{font-size:12px;font-weight:500;color:var(--t3);text-align:center;line-height:1.65;margin-bottom:20px;}
.box{background:var(--bg);border:1px solid var(--b);border-radius:13px;padding:13px 14px;margin-bottom:13px;}
.box-title{font-size:10px;font-weight:700;color:var(--p);letter-spacing:2px;margin-bottom:10px;}
.badge{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:20px;padding:1px 8px;font-size:9px;color:#047857;font-weight:700;margin-left:6px;}
.step{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;}
.step:last-child{margin-bottom:0;}
.sn{width:20px;height:20px;border-radius:50%;background:var(--p);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.st{font-size:12px;font-weight:500;color:var(--t2);line-height:1.6;}
.st a{color:var(--p);font-weight:700;text-decoration:none;}
.st strong{font-weight:700;color:var(--t);}
.lbl{font-size:10px;font-weight:700;color:var(--p);letter-spacing:2px;margin-bottom:5px;}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--b);color:var(--t);padding:11px 13px;font-size:13px;font-weight:500;border-radius:10px;margin-bottom:7px;transition:all 0.2s;}
.inp:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,0.1);background:#fff;}
.hint{font-size:11px;font-weight:500;color:var(--t4);line-height:1.6;margin-bottom:12px;}
.err{font-size:11px;font-weight:600;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none;line-height:1.55;white-space:pre-line;}
.btn{width:100%;border:none;color:#fff;padding:13px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;margin-bottom:7px;}
.btn.pri{background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.btn.sec{background:linear-gradient(135deg,#64748b,#475569);box-shadow:none;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}

/* FIREBASE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hide{display:none;}
.modal{background:#fff;border-radius:20px;padding:24px 22px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:17px;font-weight:800;margin-bottom:5px;}
.modal .msub{font-size:12px;color:var(--t3);font-weight:500;margin-bottom:16px;line-height:1.6;}
.modal-close{float:right;background:none;border:none;font-size:18px;color:var(--t4);cursor:pointer;margin-top:-4px;}
.fb-status{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:10px;margin-bottom:14px;font-size:12px;font-weight:600;}
.fb-status.active{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;}
.fb-status.inactive{background:var(--bg);border:1px solid var(--b);color:var(--t3);}

/* APP */
#app{display:none;flex-direction:column;flex:1;min-height:0;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--p),var(--pd));padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;box-shadow:0 2px 10px rgba(99,102,241,0.3);}
.hdr-dot{width:8px;height:8px;border-radius:50%;background:#a5f3fc;box-shadow:0 0 8px rgba(165,243,252,0.9);animation:lp 2s infinite;flex-shrink:0;}
@keyframes lp{0%,100%{opacity:1}50%{opacity:0.4}}
.hdr-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:3px;}
.hdr-sub{font-size:9px;color:rgba(255,255,255,0.55);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-right{margin-left:auto;display:flex;gap:5px;align-items:center;flex-shrink:0;}
.sync-pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid;cursor:pointer;white-space:nowrap;}
.sync-pill.local{background:rgba(148,163,184,0.2);border-color:rgba(148,163,184,0.35);color:#cbd5e1;}
.sync-pill.cloud{background:rgba(16,185,129,0.18);border-color:rgba(16,185,129,0.35);color:#6ee7b7;}
.sync-pill.syncing{background:rgba(251,191,36,0.18);border-color:rgba(251,191,36,0.35);color:#fde68a;}
.sync-pill.error{background:rgba(248,113,113,0.18);border-color:rgba(248,113,113,0.35);color:#fca5a5;}
.hdr-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:3px 9px;font-size:9px;color:rgba(255,255,255,0.8);font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.hdr-btn.sync-action{background:rgba(16,185,129,0.25);border-color:rgba(16,185,129,0.5);color:#6ee7b7;font-weight:700;}
.hdr-btn.sync-action:disabled{opacity:0.5;cursor:not-allowed;}
.hdr-btn.sync-action:not(:disabled):hover{background:rgba(16,185,129,0.4);}

/* SYNC BANNER */
.sync-banner{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-bottom:1px solid #fde68a;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sync-banner.hide{display:none;}
.sync-banner-text{font-size:11px;font-weight:600;color:#92400e;flex:1;}
.sync-banner-text span{font-weight:400;color:#a16207;}
.sync-banner-btn{background:#f59e0b;border:none;color:#fff;font-size:10px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.sync-banner-close{background:none;border:none;color:#a16207;cursor:pointer;font-size:14px;padding:0;}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--b);flex-shrink:0;}
.tb{flex:1;padding:12px 4px;font-size:11px;font-weight:700;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--t4);cursor:pointer;transition:all 0.18s;font-family:inherit;}
.tb.on{color:var(--p);border-bottom-color:var(--p);background:var(--pl);}

/* CHAT */
#ct{display:flex;flex:1;min-height:0;}
#sb{width:185px;background:#fff;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;}
.sb-hdr{padding:9px 11px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-ttl{font-size:9px;font-weight:700;color:var(--p);letter-spacing:2px;}
.new-btn{background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px;cursor:pointer;font-family:inherit;}
.sb-list{flex:1;overflow-y:auto;padding:5px;}
.sess{padding:9px 10px;border-radius:9px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all 0.15s;}
.sess:hover{background:var(--bg);border-color:var(--b);}
.sess.on{background:var(--pl);border-color:#c7d2fe;}
.ss-row{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;}
.ss-ttl{font-size:11px;font-weight:700;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.ss-del{background:none;border:none;color:var(--t4);cursor:pointer;font-size:13px;padding:0;line-height:1;}
.ss-del:hover{color:var(--r);}
.ss-date{font-size:9px;color:var(--t4);font-weight:500;margin-top:2px;}
.sb-empty{padding:18px 10px;text-align:center;font-size:11px;color:var(--t4);font-weight:500;line-height:1.6;}
#chat-main{display:flex;flex-direction:column;flex:1;min-width:0;}
.qrow{display:flex;gap:6px;padding:8px 11px;background:var(--bg);border-bottom:1px solid var(--b);overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.qbtn{flex-shrink:0;font-size:10px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-family:inherit;border:1px solid;}
.qbtn:active{transform:scale(0.93);}
.msgs{flex:1;overflow-y:auto;padding:12px 11px;display:flex;flex-direction:column;gap:11px;background:#fff;}
.mrow{display:flex;gap:8px;align-items:flex-start;animation:fu 0.2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.av{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.av.ax{background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 2px 6px rgba(99,102,241,0.3);}
.av.me{background:linear-gradient(135deg,#0ea5e9,var(--p));}
.bbl{flex:1;padding:9px 12px;border-radius:12px;border:1px solid;}
.bbl.ax{background:var(--bg);border-color:var(--b);border-top-left-radius:3px;}
.bbl.me{background:var(--pl);border-color:#c7d2fe;border-top-right-radius:3px;}
.m-stock{background:var(--bg);border:1px solid var(--b);border-left:4px solid var(--p);border-radius:0 9px 9px 0;padding:7px 11px;margin:8px 0 3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.m-tkr{font-size:13px;font-weight:800;color:var(--t);}
.m-vrd{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid;}
.vbuy{color:#047857;background:#dcfce7;border-color:#a7f3d0}.vsell{color:#b91c1c;background:#fee2e2;border-color:#fecaca}.vhold{color:#b45309;background:#fef3c7;border-color:#fde68a}.vtrim{color:#c2410c;background:#ffedd5;border-color:#fed7aa}
.m-news{background:#fffbeb;border-left:3px solid var(--a);border-radius:0 7px 7px 0;padding:6px 10px;margin:4px 0;font-size:12px;font-weight:500;color:#92400e;}
.m-warn{background:#fef2f2;border-left:3px solid var(--r);border-radius:0 7px 7px 0;padding:6px 10px;margin:3px 0;font-size:12px;font-weight:500;color:#991b1b;}
.m-act{background:var(--pl);border:1px solid #c7d2fe;border-radius:7px;padding:6px 10px;margin:3px 0;font-size:12px;font-weight:600;color:#3730a3;}
.m-blt{display:flex;gap:6px;padding:2px 0;align-items:flex-start;}
.m-dot{color:var(--p);font-weight:800;flex-shrink:0;}
.m-btxt{font-size:12px;color:var(--t2);line-height:1.65;}
.m-meta{font-size:12px;font-weight:600;color:var(--p);padding:2px 0;}
.m-plain{font-size:12px;color:var(--t2);line-height:1.7;}
.ibuy{font-weight:700;color:#047857;background:#dcfce7;padding:1px 5px;border-radius:4px;}
.ihold{font-weight:700;color:#b45309;background:#fef3c7;padding:1px 5px;border-radius:4px;}
.isell{font-weight:700;color:#b91c1c;background:#fee2e2;padding:1px 5px;border-radius:4px;}
.itrim{font-weight:700;color:#c2410c;background:#ffedd5;padding:1px 5px;border-radius:4px;}
.dw{display:flex;gap:4px;align-items:center;}
.d{width:6px;height:6px;border-radius:50%;background:var(--p);}
.d:nth-child(1){animation:dp 1.2s 0s infinite}.d:nth-child(2){animation:dp 1.2s 0.2s infinite}.d:nth-child(3){animation:dp 1.2s 0.4s infinite}
@keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.7)}}
.ibar{padding:9px 11px;background:var(--bg);border-top:1px solid var(--b);display:flex;gap:7px;flex-shrink:0;}
.ifield{flex:1;background:#fff;border:1.5px solid var(--b);color:var(--t);padding:10px 13px;font-size:12px;font-weight:500;border-radius:10px;transition:all 0.2s;}
.ifield:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,0.1);}
.sbtn{background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;padding:10px 15px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.sbtn:disabled{background:var(--b);color:var(--t4);cursor:not-allowed;}
.sbtn:not(:disabled):active{transform:scale(0.95);}

/* PORTFOLIO & WATCHLIST */
#pt,#wt{display:none;flex-direction:column;flex:1;min-height:0;}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0;}
.pbar-ts{font-size:10px;font-weight:600;color:var(--t4);}
.pbar-ts b{color:var(--g);}
.rbtn{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--b);color:var(--p);font-size:10px;font-weight:700;padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit;}
.rbtn:active{transform:scale(0.94);}
.rbtn.spin .ri{animation:sp 0.8s linear infinite;}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ri{display:inline-block;}
.scr{flex:1;overflow-y:auto;padding:12px 11px;background:#fff;}

/* PORTFOLIO SWITCHER */
.port-switcher{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.port-tab{flex-shrink:0;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;border:1.5px solid var(--b);background:#fff;color:var(--t3);cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;}
.port-tab.on{background:var(--p);border-color:var(--p);color:#fff;}
.port-tab.on .port-tab-val{color:rgba(255,255,255,0.75);}
.port-tab:not(.on):hover{border-color:var(--p);color:var(--p);}
.port-tab:not(.on) .port-tab-val{color:var(--p);opacity:0.75;}
.port-tab.drag-over{border-color:var(--p);background:var(--pl);color:var(--p);transform:scale(1.06);box-shadow:0 0 0 2px rgba(99,102,241,0.3);}
.port-tab[draggable]{cursor:grab;}
.port-tab[draggable]:active{cursor:grabbing;}
.port-tab-val{font-size:9px;font-weight:600;letter-spacing:0;}
.port-add-btn{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(99,102,241,0.3);}

/* PORTFOLIO CARDS & ROWS */
.fcrd{background:var(--bg);border:1px solid var(--b);border-radius:13px;padding:13px;margin-bottom:11px;}
.flbl{font-size:10px;font-weight:700;color:var(--p);letter-spacing:2px;margin-bottom:9px;}
.frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.finp{background:#fff;border:1.5px solid var(--b);color:var(--t);padding:9px 10px;font-size:12px;font-weight:500;border-radius:8px;transition:all 0.2s;font-family:inherit;}
.finp:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,0.1);}
.abtn{background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.abtn:active{transform:scale(0.94);}
.pcrd{background:#fff;border:1px solid var(--b);border-radius:13px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.prow{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid #f8fafc;gap:7px;}
.prow:last-child{border-bottom:none;}.prow:hover{background:var(--bg);}
.pr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pr-inf{flex:1;min-width:0;}
.pr-name{font-size:13px;font-weight:800;color:var(--t);}
.pr-sub{font-size:10px;color:var(--t4);font-weight:500;margin-top:1px;}
.pr-pnl{text-align:right;margin-right:5px;}
.pr-pv{font-size:11px;font-weight:700;}
.pr-pp{font-size:10px;font-weight:600;margin-top:1px;}
.up{color:var(--g)}.dn{color:var(--r)}
.pr-px{text-align:right;margin-right:5px;}
.pr-pxv{font-size:13px;font-weight:800;color:var(--t);}
.pr-pxc{font-size:9px;font-weight:700;margin-top:1px;}
.ldg{font-size:10px;color:var(--t4);font-style:italic;}
.pr-del{background:#fee2e2;border:none;color:var(--r);font-size:10px;font-weight:700;width:21px;height:21px;border-radius:5px;cursor:pointer;flex-shrink:0;}
.pr-edit-icon{font-size:13px;flex-shrink:0;opacity:0;transition:opacity 0.15s;cursor:pointer;}
.prow:hover .pr-edit-icon{opacity:1;}
.prow-wrap.editing .prow{background:var(--pl);border-radius:13px 13px 0 0;}
.pr-edit-panel{background:#f0f4ff;border-top:1px solid #c7d2fe;}
.pr-edit-panel.hide{display:none;}
.pr-edit-inner{padding:12px 14px;}
.pr-edit-title{font-size:11px;font-weight:700;color:var(--p);letter-spacing:1px;margin-bottom:10px;}
.pr-edit-row{display:flex;gap:10px;margin-bottom:12px;}
.pr-edit-field{flex:1;}
.pr-edit-lbl{font-size:9px;font-weight:700;color:var(--p);letter-spacing:2px;margin-bottom:4px;}
.pr-edit-inp{width:100%;background:#fff;border:1.5px solid #c7d2fe;color:var(--t);padding:9px 11px;font-size:13px;font-weight:600;border-radius:9px;font-family:inherit;transition:border-color 0.2s;}
.pr-edit-inp:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(99,102,241,0.12);}
.pr-edit-actions{display:flex;gap:8px;}
.pr-save-btn{flex:1;background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.pr-save-btn:active{transform:scale(0.96);}

function fbUrl(path){return `https://firestore.googleapis.com/v1/projects/${FB_PID}/databases/(default)/documents/${path}?key=${FB_KEY}`;}
function userPath(key){
  if(USER_ID)return `stockr_users/${USER_ID}/data/${key}`;
  return `stockr_guest/data/${key}`;
}

async function fbRead(path){
  const r=await fetch(fbUrl(path));
  if(r.status===404)return null;
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Read error '+r.status);}
  const doc=await r.json();
  const raw=doc.fields?.d?.stringValue;
  return raw?JSON.parse(raw):null;
}

async function fbWrite(path,data){
  const r=await fetch(fbUrl(path),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{d:{stringValue:JSON.stringify(data)}}})});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Write error '+r.status);}
}

// SHA-256 hash for password storage (browser built-in, no library needed)
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Safe Firestore key from email (no dots/special chars)
function emailToKey(email){return email.toLowerCase().replace(/[^a-z0-9]/g,'_');}

async function fbList(colPath){
  const r=await fetch(fbUrl(colPath));
  if(!r.ok)return[];
  const d=await r.json();
  return(d.documents||[]).map(doc=>{
    const id=doc.name.split('/').pop();
    try{return{id,...JSON.parse(doc.fields?.d?.stringValue||'{}')};}
    catch{return{id};}
  });
}

async function fbDelete(path){
  await fetch(fbUrl(path),{method:'DELETE'}).catch(e=>console.warn('FB:',e?.message||e));
}

async function pushAllToFirebase(){
  const p=userPath;
  await fbWrite(p('config'),{claudeKey:CK,finnhubKey:FK,updatedAt:Date.now()});
  await fbWrite(p('portfolios'),{portfolios:PORTFOLIOS,updatedAt:Date.now()});
  await fbWrite(p('watchlist'),{watchlist:WATCH,updatedAt:Date.now()});
  const toSave=sessions.slice(0,30).map(s=>({...s,msgs:(s.msgs||[]).slice(-60)}));
  await fbWrite(p('sessions'),{sessions:toSave,updatedAt:Date.now()});
}

async function pullFromFirebase(){
  const p=userPath;
  const cfg=await fbRead(p('config'));
  if(cfg){
    if(cfg.claudeKey&&!CK){CK=cfg.claudeKey;LS.set('st_ck',CK);}
    if(cfg.finnhubKey&&!FK){FK=cfg.finnhubKey;LS.set('st_fk',FK);}
  }
  const portData=await fbRead(p('portfolios'));
  if(portData?.portfolios?.length){
    PORTFOLIOS=portData.portfolios;
    if(!ACTIVE_PORT_ID||!PORTFOLIOS.find(p=>p.id===ACTIVE_PORT_ID)){
      ACTIVE_PORT_ID=PORTFOLIOS[0].id;
    }
    saveLocal();
  }
  const wlData=await fbRead(p('watchlist'));
  if(wlData?.watchlist){WATCH=wlData.watchlist;LS.set('st_watch',WATCH);}
  const sessData=await fbRead(p('sessions'));
  if(sessData?.sessions?.length){
    sessions=sessData.sessions.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    saveLocalSessions();
  }
  const rpData=await fbRead(p('reports'));
  if(rpData?.reports?.length){weeklyReports=rpData.reports;LS.set('st_reports',weeklyReports);}
  if(document.getElementById('app')?.style.display!=='none'){
    renderPortSwitcher();renderPORT();renderWATCH();renderSB();renderMSGS();
  }
}

let dragSrcIdx=null;

function renderPortSwitcher(){
  const el=document.getElementById('port-switcher');
  el.innerHTML='';

  PORTFOLIOS.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='port-tab'+(p.id===ACTIVE_PORT_ID?' on':'');
    btn.dataset.idx=i;
    btn.draggable=true;
    btn.title='Drag to reorder';

    // Calculate total value: market value if prices available, else deposit
    const pos=p.positions||[];
    const deposit=pos.reduce((s,x)=>s+x.shares*x.cost,0);
    let marketVal=0,hasPx=false;
    pos.forEach(x=>{const q=PC[x.ticker];if(q){marketVal+=x.shares*q.c;hasPx=true;}else{marketVal+=x.shares*x.cost;}});
    const totalVal=pos.length>0?marketVal:0;
    const valStr=totalVal>0?'$'+totalVal.toLocaleString('en',{maximumFractionDigits:0}):'—';
    const pnl=hasPx?marketVal-deposit:0;
    const valColor=hasPx?(pnl>=0?'#10b981':'#ef4444'):null;

    btn.innerHTML=`<span>${p.name}</span><span class="port-tab-val"${valColor&&p.id===ACTIVE_PORT_ID?'':valColor?` style="color:${valColor};opacity:1"`:''}>${valStr}</span>`;

    // Click to switch
    btn.onclick=()=>switchPort(p.id);

    // ── Desktop drag ──
    btn.addEventListener('dragstart',e=>{
      dragSrcIdx=i;
      btn.style.opacity='0.45';
      e.dataTransfer.effectAllowed='move';
    });
    btn.addEventListener('dragend',()=>{
      btn.style.opacity='';
      document.querySelectorAll('.port-tab').forEach(b=>b.classList.remove('drag-over'));
    });
    btn.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      btn.classList.add('drag-over');
    });
    btn.addEventListener('dragleave',()=>btn.classList.remove('drag-over'));
    btn.addEventListener('drop',e=>{
      e.preventDefault();btn.classList.remove('drag-over');
      if(dragSrcIdx===null||dragSrcIdx===i)return;
      // Reorder
      const moved=PORTFOLIOS.splice(dragSrcIdx,1)[0];
      PORTFOLIOS.splice(i,0,moved);
      dragSrcIdx=null;
      saveLocal();renderPortSwitcher();
    });

    // ── Touch drag (mobile) ──
    let touchStartX=0,touchStartY=0,touchClone=null,touchMoved=false;
    btn.addEventListener('touchstart',e=>{
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
      touchMoved=false;
      dragSrcIdx=i;
    },{passive:true});
    btn.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-touchStartX;
      const dy=e.touches[0].clientY-touchStartY;
      if(!touchMoved&&Math.abs(dx)>8){touchMoved=true;}
      if(!touchMoved)return;
      e.preventDefault();
      // Highlight target
      const touch=e.touches[0];
      document.querySelectorAll('.port-tab').forEach(b=>{
        const r=b.getBoundingClientRect();
        if(touch.clientX>=r.left&&touch.clientX<=r.right&&touch.clientY>=r.top&&touch.clientY<=r.bottom){
          b.classList.add('drag-over');
        }else{b.classList.remove('drag-over');}
      });
    },{passive:false});
    btn.addEventListener('touchend',e=>{
      document.querySelectorAll('.port-tab').forEach(b=>b.classList.remove('drag-over'));
      if(!touchMoved){dragSrcIdx=null;return;}
      const touch=e.changedTouches[0];
      let targetIdx=null;
      document.querySelectorAll('.port-tab').forEach((b,j)=>{
        const r=b.getBoundingClientRect();
        if(touch.clientX>=r.left&&touch.clientX<=r.right&&touch.clientY>=r.top&&touch.clientY<=r.bottom){
          targetIdx=parseInt(b.dataset.idx);
        }
      });
      if(targetIdx!==null&&targetIdx!==dragSrcIdx){
        const moved=PORTFOLIOS.splice(dragSrcIdx,1)[0];
        PORTFOLIOS.splice(targetIdx,0,moved);
        saveLocal();renderPortSwitcher();
      }
      dragSrcIdx=null;touchMoved=false;
    });

    // Wrap tab + ⋯ menu button
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;align-items:center;gap:2px;flex-shrink:0;';
    wrap.appendChild(btn);

    // ⋯ options button (rename + delete) — visible on mobile and desktop
    if(PORTFOLIOS.length>0){
      const more=document.createElement('button');
      more.style.cssText='background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:6px;flex-shrink:0;';
      more.textContent='⋯';
      more.title='Portfolio options';
      more.onclick=(e)=>{e.stopPropagation();showPortMenu(e,p.id);};
      wrap.appendChild(more);
    }

    el.appendChild(wrap);
  });

  // Add new portfolio button
  const addBtn=document.createElement('button');
  addBtn.className='port-add-btn';addBtn.title='New Portfolio';addBtn.textContent='+';
  addBtn.onclick=createPortfolio;
  el.appendChild(addBtn);
}

// ── PRICES ──
// Cache resolved ticker → full Yahoo symbol (e.g. VUAA → VUAA.L) persisted to localStorage
const TICKER_CACHE=JSON.parse(localStorage.getItem('st_ticker_cache')||'{}');
function saveTCache(){localStorage.setItem('st_ticker_cache',JSON.stringify(TICKER_CACHE));}

// Exchange suffixes to probe (most common first)
const YAHOO_SUFFIXES=['.L','.AS','.PA','.DE','.MI','.MC','.ST','.OL','.SW','.HE','.CO','.BR','.LS','.VI','.F','.BE','.SG'];

// Try Yahoo Finance URL directly, then via CORS proxies
async function yahooFetch(symbol){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
  const proxies=[
    u=>u,
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  ];
  for(const wrap of proxies){
    try{
      const r=await fetch(wrap(url),{signal:AbortSignal.timeout(7000)});
      if(!r.ok)continue;
      const d=await r.json();
      if(d?.chart?.result?.[0]?.meta?.regularMarketPrice)return d;
    }catch{}
  }
  return null;
}

async function fetchYahoo(t){
  try{
    const data=await yahooFetch(t);
    if(!data)return null;
    const meta=data.chart.result[0].meta;
    const c=meta.regularMarketPrice;
    const pc=meta.previousClose||meta.chartPreviousClose||c;
    const diff=c-pc;
    const dp=pc>0?(diff/pc)*100:0;
    return{c,d:diff,dp,h:meta.regularMarketDayHigh||c,l:meta.regularMarketDayLow||c,pc,src:'yahoo',currency:meta.currency||'USD'};
  }catch{return null;}
}

async function fetchPrice(t){
  // Use cached resolved symbol if available (e.g. VUAA → VUAA.L)
  const resolved=TICKER_CACHE[t];
  if(resolved&&resolved!==t){
    const r=await fetchYahoo(resolved);
    if(r)return r;
    delete TICKER_CACHE[t];saveTCache(); // stale cache, re-probe
  }

  // Ticker already has exchange suffix → Yahoo only
  if(t.includes('.')){
    const r=await fetchYahoo(t);
    if(r){TICKER_CACHE[t]=t;saveTCache();}
    return r;
  }

  // Try Finnhub first — fast, no CORS issues, great for all US stocks (only if key is set)
  if(FK&&FK.length>8){
    try{
      const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${t}&token=${FK}`,{signal:AbortSignal.timeout(7000)});
      if(r.ok){
        const d=await r.json();
        if(d.c&&d.c>0){TICKER_CACHE[t]=t;saveTCache();return{c:d.c,d:d.d,dp:d.dp,h:d.h,l:d.l,pc:d.pc,src:'finnhub',currency:'USD'};}
      }
    }catch{}
  }

  // Finnhub returned nothing → try Yahoo as-is (META, SPY etc. work here too)
  const direct=await fetchYahoo(t);
  if(direct){TICKER_CACHE[t]=t;saveTCache();return direct;}

  // Try exchange suffixes (VUAA → VUAA.L, etc.)
  for(const sfx of YAHOO_SUFFIXES){
    const r=await fetchYahoo(t+sfx);
    if(r){TICKER_CACHE[t]=t+sfx;saveTCache();return r;}
  }
  return null;
}
async function fetchAll(tks){
  const res=await Promise.all(tks.map(t=>fetchPrice(t)));
  const out={};tks.forEach((t,i)=>{if(res[i])out[t]=res[i];});return out;
}

const f2=n=>n!=null?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const fchg=n=>n!=null?(n>=0?'+':'')+f2(n):'';
const fpct=n=>n!=null?(n>=0?'+':'')+n.toFixed(2)+'%':'';
// Returns currency symbol for a price quote (Yahoo gives currency, Finnhub is always USD)
function currSym(q){
  if(!q)return'$';
  const c=q.currency||'USD';
  // GBp (pence) → divide by 100 already done by Yahoo, show £
  const map={USD:'$',GBP:'£',GBp:'£',EUR:'€',CHF:'Fr',CAD:'CA$',AUD:'A$',JPY:'¥',HKD:'HK$',SEK:'kr',NOK:'kr',DKK:'kr',SGD:'S$',NZD:'NZ$'};
  return map[c]||c+' ';
}

// ── MESSAGES ──
function pl(line){
  if(!line.trim())return'<div style="height:4px"></div>';
  if(line.startsWith('▶')){
    const rest=line.replace('▶ ','');const d=rest.indexOf(' — ');
    const t=d>-1?rest.slice(0,d):rest;const v=d>-1?rest.slice(d+3):'';
    const vc=v.includes('BUY')?'vbuy':v.includes('SELL')||v.includes('EXIT')?'vsell':v.includes('TRIM')?'vtrim':'vhold';
    return`<div class="m-stock"><span class="m-tkr">${t}</span>${v?`<span class="m-vrd ${vc}">${v}</span>`:''}</div>`;
  }
  if(line.startsWith('📰'))return`<div class="m-news">${line}</div>`;
  if(line.startsWith('⚠'))return`<div class="m-warn">${line}</div>`;
  if(line.startsWith('→'))return`<div class="m-act">${line}</div>`;
  if(line.startsWith('•'))return`<div class="m-blt"><span class="m-dot">·</span><span class="m-btxt">${line.replace(/^•\s*/,'')}</span></div>`;
  if(/^(Price:|Score|Overall|Key takeaway|BEST OPPORTUNITY)/.test(line))return`<div class="m-meta">${line}</div>`;
  if(/\b(BUY|HOLD|SELL|TRIM|EXIT)\b/.test(line)){
    const c=line.replace(/\bBUY\b/g,'<span class="ibuy">BUY</span>').replace(/\bHOLD\b/g,'<span class="ihold">HOLD</span>').replace(/\bSELL\b/g,'<span class="isell">SELL</span>').replace(/\bTRIM\b/g,'<span class="itrim">TRIM</span>').replace(/\bEXIT\b/g,'<span class="isell">EXIT</span>');
    return`<div class="m-plain">${c}</div>`;
  }
  return`<div class="m-plain">${line}</div>`;
}

async function newSess(){
  const id='s_'+Date.now();
  const sess={id,title:'New chat',date:new Date().toLocaleDateString(),msgs:[{r:'a',c:"New conversation started.\n→ Ask me about any stock, your portfolio, or today's market news."}],updatedAt:Date.now()};
  sessions.unshift(sess);curId=id;MSGS=sess.msgs;
  saveLocalSessions();saveSessionsToFirebase();renderSB();renderMSGS();closeSB();
  setTimeout(()=>document.getElementById('minp').focus(),100);
}
function loadSess(id){
  const s=sessions.find(s=>s.id===id);if(!s)return;
  curId=id;MSGS=s.msgs||[];renderSB();renderMSGS();closeSB();
}
function delSess(id,e){
  e.stopPropagation();
  sessions=sessions.filter(s=>s.id!==id);
  if(curId===id){
    if(sessions.length){curId=sessions[0].id;MSGS=sessions[0].msgs||[];}
    else{newSess();return;}
  }
  saveLocalSessions();saveSessionsToFirebase();renderSB();renderMSGS();
}
function updateTitle(msg){
  const s=sessions.find(s=>s.id===curId);
  if(s&&(s.title==='New chat'||!s.title)){s.title=msg.slice(0,32)+(msg.length>32?'…':'');renderSB();}
}
function renderSB(){
  const el=document.getElementById('sb-list');
  if(!sessions.length){el.innerHTML='<div class="sb-empty">No history yet.<br>Start a conversation.</div>';return;}
  el.innerHTML=sessions.map(s=>`
    <div class="sess ${s.id===curId?'on':''}" onclick="loadSess('${s.id}')">
      <div class="ss-row"><div class="ss-ttl">${s.title||'Chat'}</div><button class="ss-del" onclick="delSess('${s.id}',event)">✕</button></div>
      <div class="ss-date">${s.date||''}</div>
    </div>`).join('');
}

// ── SEND ──
async function doSend(ov){
  const inp=document.getElementById('minp');
  const msg=ov||inp.value.trim();if(!msg||loading)return;
  inp.value='';
  if(!curId)await newSess();
  updateTitle(msg);
  if(!CK||!CK.startsWith('sk-ant')){
    MSGS.push({r:'u',c:msg});MSGS.push({r:'a',c:t('no_key_msg')});
    renderMSGS();
    const si=sessions.findIndex(s=>s.id===curId);
    const upd={id:curId,title:sessions[si]?.title||'Chat',date:new Date().toLocaleDateString(),msgs:MSGS,updatedAt:Date.now()};
    if(si>=0)sessions[si]=upd;else sessions.unshift(upd);
    saveLocalSessions();saveSessionsToFirebase();renderSB();return;
  }
  const allPortText=PORTFOLIOS.map(p=>`[${p.name}]: ${p.positions.map(x=>`${x.ticker} ${x.shares}sh@$${x.cost}`).join(', ')}`).join(' | ');
  const wl=WATCH.map(w=>w.ticker).join(',');
  MSGS.push({r:'u',c:msg});loading=true;
  document.getElementById('sbtn').disabled=true;renderMSGS();
  try{
    const hist=MSGS.slice(-16).map((m,i,a)=>({
      role:m.r==='a'?'assistant':'user',
      content:i===a.length-1?`PORTFOLIOS: ${allPortText} | WATCHLIST: ${wl}\nREQUEST: ${m.c}`:m.c
    }));
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':CK,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:1500,system:SYS,tools:[{type:'web_search_20250305',name:'web_search'}],messages:hist})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||'API error');
    const reply=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'No response.';
    MSGS.push({r:'a',c:reply});
  }catch(e){
    let m=e.message;if(m==='Failed to fetch')m='Connection failed.';
    MSGS.push({r:'a',c:`⚠ ${m}`});
  }
  clearInterval(liv);loading=false;
  document.getElementById('sbtn').disabled=false;renderMSGS();
  const si=sessions.findIndex(s=>s.id===curId);
  const upd={id:curId,title:sessions[si]?.title||'Chat',date:new Date().toLocaleDateString(),msgs:MSGS,updatedAt:Date.now()};
  if(si>=0)sessions[si]=upd;else sessions.unshift(upd);
  saveLocalSessions();saveSessionsToFirebase();renderSB();
  setTimeout(()=>document.getElementById('minp').focus(),100);
}

function parseMarkdown(md){
  return md
    .replace(/^# (.+)$/gm,'<h1 style="font-size:22px;font-weight:800;color:var(--t);margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--pl);">$1</h1>')
    .replace(/^## (.+)$/gm,'<h2 style="font-size:16px;font-weight:800;color:var(--p);margin:24px 0 10px;">$1</h2>')
    .replace(/^### (.+)$/gm,'<h3 style="font-size:14px;font-weight:700;color:var(--t);margin:16px 0 8px;">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--b);margin:20px 0;">')
    .replace(/^[*-] (.+)$/gm,'<li style="margin-bottom:5px;line-height:1.6;">$1</li>')
    .replace(/(<li[^>]*>.*?<\/li>\n?)+/gs,'<ul style="margin:8px 0 12px 18px;">$&</ul>')
    .replace(/\n\n/g,'<br><br>');
}

async function authLogin(){
  const email=(document.getElementById('auth-email').value||'').trim().toLowerCase();
  const pass=document.getElementById('auth-pass').value;
  showErr('auth-err','');
  if(!email||!pass){showErr('auth-err',t('auth_err_empty'));return;}
  const btn=document.getElementById('auth-submit-btn');btn.disabled=true;btn.textContent=t('auth_signing');
  try{
    const key=emailToKey(email);
    const userData=await fbRead(`stockr_accounts/${key}`);
    if(!userData){throw new Error(t('auth_err_nouser'));}
    const hash=await sha256(pass+userData.salt);
    if(hash!==userData.passwordHash){throw new Error(t('auth_err_wrongpass'));}
    USER_ID=key;USER_EMAIL=email;IS_GUEST=false;FB_ACTIVE=true;
    LS.set('st_auth',{uid:key,email,ts:Date.now()});
    await startApp();
  }catch(e){showErr('auth-err',e.message);btn.disabled=false;btn.textContent=t('auth_signin');}
}

async function authRegister(){
  const email=(document.getElementById('auth-email').value||'').trim().toLowerCase();
  const pass=document.getElementById('auth-pass').value;
  showErr('auth-err','');
  if(!email||!pass){showErr('auth-err',t('auth_err_empty'));return;}
  if(!email.includes('@')){showErr('auth-err',t('auth_err_email'));return;}
  if(pass.length<6){showErr('auth-err',t('auth_err_pass'));return;}
  const btn=document.getElementById('auth-submit-btn');btn.disabled=true;btn.textContent=t('auth_creating');
  try{
    const key=emailToKey(email);
    const existing=await fbRead(`stockr_accounts/${key}`);
    if(existing){throw new Error(t('auth_err_exists'));}
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const passwordHash=await sha256(pass+salt);
    await fbWrite(`stockr_accounts/${key}`,{email,passwordHash,salt,createdAt:Date.now()});
    USER_ID=key;USER_EMAIL=email;IS_GUEST=false;FB_ACTIVE=true;
    LS.set('st_auth',{uid:key,email,ts:Date.now()});
    await startApp();
  }catch(e){showErr('auth-err',e.message);btn.disabled=false;btn.textContent=t('auth_register');}
}

async function authResetPassword(emailOverride){
  const email=emailOverride||(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
  if(!email){showErr('auth-err','Enter your email address above first.');return;}
  try{
    const key=emailToKey(email);
    const userData=await fbRead(`stockr_accounts/${key}`);
    if(!userData){
      // Don't reveal if email exists — show same message either way
      alert('If an account exists for '+email+', a reset code has been sent.');return;
    }
    // Generate a reset token valid for 1 hour
    const token=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
    const expiry=Date.now()+3600000;
    await fbWrite(`stockr_accounts/${key}_reset`,{token,expiry});
    // Since we can't send email without a backend, show the token to the user
    const newPass=prompt(`Enter a new password for ${email} (min 6 characters):`);
    if(!newPass||newPass.length<6){alert('Password must be at least 6 characters.');return;}
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const passwordHash=await sha256(newPass+salt);
    await fbWrite(`stockr_accounts/${key}`,{...userData,passwordHash,salt,updatedAt:Date.now()});
    alert('✓ Password updated successfully! You can now sign in with your new password.');
  }catch(e){
    const msg=e.message||'Failed.';
    if(emailOverride)alert('Error: '+msg);else showErr('auth-err',msg);
  }
}

      <button onclick="authLogout()" style="flex:1;background:#fee2e2;border:none;color:var(--r);font-size:12px;font-weight:700;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;">↩ Sign out</button>
    </div>`:''}
  </div>
  <div style="font-size:10px;font-weight:700;color:var(--t3);letter-spacing:2px;margin:0 2px 8px;">${t('services')}</div>
  ${serviceCard('ck-panel','🤖','Claude AI Analysis',ckOk?'Connected — AI analysis enabled':'Add your key to enable AI analysis',ckOk,'ON','OFF',`
    <div style="font-size:10px;font-weight:700;color:var(--p);letter-spacing:2px;margin-bottom:6px;">ANTHROPIC API KEY</div>
    <input class="mob-finp" id="prof-ck" type="password" placeholder="sk-ant-api03-..." value="${CK||''}" style="margin-bottom:8px;display:block;">
    <div style="font-size:11px;color:var(--t4);margin-bottom:10px;line-height:1.5;">Get your key at <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--p);font-weight:600;">console.anthropic.com</a>. ~$0.01–0.03 per analysis.</div>
    <button onclick="saveProfileKey('ck')" class="mob-add-btn" style="font-size:13px;padding:12px;">${ckOk?'Update Key':'Connect Claude AI'}</button>`)}

  <!-- Language selector -->
  <div style="background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
    <div style="padding:14px 16px;display:flex;align-items:center;gap:12px;">
      <div style="width:36px;height:36px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">🌐</div>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--t);">${t('language_title')}</div><div style="font-size:11px;color:#10b981;margin-top:1px;">${LANG==='mk'?'Македонски':'English'}</div></div>
    </div>
    <div style="padding:0 16px 14px;display:flex;gap:10px;">
      <div onclick="setLang('en')" style="flex:1;padding:12px;border-radius:10px;border:2px solid ${LANG==='en'?'var(--p)':'var(--b)'};background:${LANG==='en'?'var(--pl)':'#f8fafc'};cursor:pointer;text-align:center;transition:all 0.15s;">
        <div style="font-size:20px;margin-bottom:4px;">🇬🇧</div>
        <div style="font-size:12px;font-weight:700;color:${LANG==='en'?'var(--p)':'var(--t)'};">English</div>
        ${LANG==='en'?'<div style="font-size:10px;font-weight:700;color:var(--p);margin-top:3px;">✓ ACTIVE</div>':''}
      </div>
      <div onclick="setLang('mk')" style="flex:1;padding:12px;border-radius:10px;border:2px solid ${LANG==='mk'?'var(--p)':'var(--b)'};background:${LANG==='mk'?'var(--pl)':'#f8fafc'};cursor:pointer;text-align:center;transition:all 0.15s;">
        <div style="font-size:20px;margin-bottom:4px;">🇲🇰</div>
        <div style="font-size:12px;font-weight:700;color:${LANG==='mk'?'var(--p)':'var(--t)'};">Македонски</div>
        ${LANG==='mk'?'<div style="font-size:10px;font-weight:700;color:var(--p);margin-top:3px;">✓ АКТИВЕН</div>':''}
      </div>
    </div>
  </div>

  <!-- Model selector -->
  <div style="background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
    <div style="padding:14px 16px;display:flex;align-items:center;gap:12px;">
      <div style="width:36px;height:36px;border-radius:10px;background:#f0f4ff;border:1px solid #c7d2fe;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">⚡</div>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--t);">Claude Model</div><div style="font-size:11px;color:#6366f1;margin-top:1px;">${CLAUDE_MODELS.find(m=>m.id===CLAUDE_MODEL)?.label||'Sonnet 4.5'}</div></div>
    </div>
    <div style="padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;">
      ${CLAUDE_MODELS.map(m=>`
      <div onclick="setModel('${m.id}')" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:2px solid ${CLAUDE_MODEL===m.id?'var(--p)':'var(--b)'};background:${CLAUDE_MODEL===m.id?'var(--pl)':'#f8fafc'};cursor:pointer;transition:all 0.15s;">
        <div style="width:16px;height:16px;border-radius:50%;border:2px solid ${CLAUDE_MODEL===m.id?'var(--p)':'#cbd5e1'};background:${CLAUDE_MODEL===m.id?'var(--p)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
          ${CLAUDE_MODEL===m.id?'<div style="width:6px;height:6px;border-radius:50%;background:#fff;"></div>':''}
        </div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:${CLAUDE_MODEL===m.id?'var(--p)':'var(--t)'};">${m.label}</div>
          <div style="font-size:11px;color:var(--t3);">${m.desc}</div>
        </div>
        ${CLAUDE_MODEL===m.id?'<div style="font-size:10px;font-weight:700;background:var(--p);color:#fff;padding:3px 8px;border-radius:20px;">ACTIVE</div>':''}
      </div>`).join('')}
    </div>
  </div>
  <div style="background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);display:flex;align-items:center;gap:12px;">
    <div style="width:36px;height:36px;border-radius:10px;background:#ecfdf5;border:1px solid #a7f3d0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">📈</div>
    <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--t);">Real-Time Prices</div><div style="font-size:11px;color:#10b981;margin-top:1px;">Finnhub + Yahoo Finance — pre-configured ✓</div></div>
    <div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#dcfce7;color:#047857;">ON</div>
  </div>
  <div style="background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);display:flex;align-items:center;gap:12px;">
    <div style="width:36px;height:36px;border-radius:10px;background:${fbOk?'#ecfdf5':'#f8fafc'};border:1px solid ${fbOk?'#a7f3d0':'#e2e8f0'};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">☁️</div>
    <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--t);">Firebase Sync</div><div style="font-size:11px;color:${fbOk?'#10b981':'#94a3b8'};margin-top:1px;">${fbOk?`Syncing as ${USER_EMAIL}`:'Sign in to enable sync'}</div></div>
    <div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:${fbOk?'#dcfce7':'#f1f5f9'};color:${fbOk?'#047857':'#94a3b8'};">${fbOk?'ON':'OFF'}</div>
  </div>
  ${IS_GUEST?`<button onclick="document.getElementById('app').style.display='none';document.getElementById('auth-screen').style.display='flex';" style="width:100%;background:linear-gradient(135deg,var(--p),var(--pd));border:none;color:#fff;padding:14px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(99,102,241,0.35);">Sign in / Create Account</button>`:''}`;
}

function serviceCard(panelId,icon,title,subtitle,on,onLabel,offLabel,panelContent){
  return `<div style="background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
    <div style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleService('${panelId}')">
      <div style="width:36px;height:36px;border-radius:10px;background:${on?'#ecfdf5':'#f8fafc'};border:1px solid ${on?'#a7f3d0':'#e2e8f0'};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${icon}</div>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--t);">${title}</div><div style="font-size:11px;color:${on?'#10b981':'#94a3b8'};margin-top:1px;">${subtitle}</div></div>
      <div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:${on?'#dcfce7':'#f1f5f9'};color:${on?'#047857':'#94a3b8'};">${on?onLabel:offLabel}</div>
    </div>
    <div id="${panelId}" style="display:none;padding:0 16px 14px;">${panelContent}</div>
  </div>`;
}

function toggleService(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

function setModel(id){
  CLAUDE_MODEL=id;
  LS.set('st_model',id);
  renderProfile();
}

function saveProfileKey(type){
  if(type==='ck'){
    const val=(document.getElementById('prof-ck').value||'').trim();
    if(!val.startsWith('sk-ant')){alert('Claude key must start with sk-ant-...');return;}
    CK=val;LS.set('st_ck',CK);
  }else{
    const val=(document.getElementById('prof-fk').value||'').trim();
    if(!val){alert('Please enter a Finnhub key.');return;}
    FK=val;LS.set('st_fk',FK);
  }
  if(FB_ACTIVE)fbWrite(userPath('config'),{claudeKey:CK,finnhubKey:FK,updatedAt:Date.now()}).catch(e=>console.warn('FB:',e?.message||e));
  renderProfile();alert('✓ Saved!');
}


function showErr(id,msg){const e=document.getElementById(id);if(!e)return;e.style.display=msg?'block':'none';e.textContent=msg||'';}
function toggleSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

// ── BOOT ──
document.addEventListener('DOMContentLoaded',async()=>{
  CLAUDE_MODEL=LS.get('st_model')||'claude-sonnet-4-5';
  LANG=LS.get('st_lang')||'en';
  applyLang();
  const saved=LS.get('st_auth');
  if(saved?.uid&&saved?.email){
    USER_ID=saved.uid;USER_EMAIL=saved.email;IS_GUEST=false;FB_ACTIVE=true;
    await startApp();
    return;
  }
  document.getElementById('auth-screen').style.display='flex';
});
</script>
</body>
</html>
